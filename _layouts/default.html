<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="gnb">
    <div class="gnb-inner">
      <a href="{{ '/' | relative_url }}" class="gnb-title">
        <span class="gnb-logo">LC</span>
        <span class="gnb-name">{{ site.title }}</span>
      </a>
      <nav class="gnb-nav">
        {% for podcast in site.data.podcasts %}
          {% assign lessons = site.data.lessons[podcast.slug] %}
          {% if lessons.size > 0 %}
          <a href="{{ lessons.first.url | relative_url }}"
             class="gnb-link {% if page.show == podcast.full_name %}active{% endif %}"
             style="--podcast-color: {{ podcast.color }}; --podcast-color-light: {{ podcast.color_light }};">
            {{ podcast.name }}
          </a>
          {% else %}
          <span class="gnb-link disabled" style="--podcast-color: {{ podcast.color }};">
            {{ podcast.name }}
          </span>
          {% endif %}
        {% endfor %}
      </nav>
      <button class="gnb-menu-btn" aria-label="Toggle menu" onclick="document.querySelector('.gnb-nav').classList.toggle('open')">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>Generated from EBS FM podcast transcripts using AI</p>
  </footer>
</body>
</html>
